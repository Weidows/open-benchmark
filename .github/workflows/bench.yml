name: bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  run:
    name: ${{ matrix.os }} quick suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run quick suite
        shell: bash
        run: |
          uv sync
          mkdir -p ci-out
          uv run open-benchmark run --suite quick --json "ci-out/${{ matrix.os }}.jsonl" --quiet
      - name: Job summary
        shell: bash
        run: uv run open-benchmark leaderboard ci-out --out leaderboard-${{ matrix.os }}.md
      - uses: actions/upload-artifact@v4
        with:
          name: open-benchmark-results-${{ matrix.os }}
          path: ci-out/*.jsonl

  aggregate:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          path: ci-results
          pattern: open-benchmark-results-*
          merge-multiple: true
      - name: Build leaderboard
        shell: bash
        run: |
          uv sync
          uv run open-benchmark leaderboard ci-results --bound hardware --out LEADERBOARD.md
          cat LEADERBOARD.md
      - name: Commit results and open PR
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p results/ci
          cp ci-results/*.jsonl results/ci/
          git config user.name "open-benchmark-bot"
          git config user.email "open-benchmark@users.noreply.github.com"
          branch="ci/results-${{ github.run_id }}"
          git checkout -b "$branch"
          git add LEADERBOARD.md results/ci
          git commit -m "ci: quick-suite results for ${{ github.sha }}"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "ci: hardware benchmark results (${{ github.sha }})" \
            --body "Automated quick-suite run on GitHub runners. Runner numbers are noisy: use them for same-runner regressions only."
